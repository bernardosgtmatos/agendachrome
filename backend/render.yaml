# Render Blueprint - Configuração de deploy automático
# https://render.com/docs/blueprint-spec
#
# ⚠️ ANTES DE FAZER DEPLOY:
# 1. Em prisma/schema.prisma, troque provider de "sqlite" para "postgresql"
# 2. Commit e push para o GitHub
# 3. Conecte o repositório ao Render

services:
  - type: web
    name: chromebook-agendamento
    env: node
    region: free
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run seed
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: chromebook-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://chromebook-agendamento.onrender.com

databases:
  - name: chromebook-db
    databaseName: chromebook
    region: free
    plan: free
